<!doctype html>
<!--
  PAGINA HTML UNICA dell'app (single page application). Il browser carica questo file, che a sua volta carica src/main.ts (modulo) e quindi App.svelte.
  Contiene: la Content-Security-Policy (consente solo risorse proprie e gli endpoint Google necessari a login, Drive e Calendar), il tema/colore della PWA,
  le icone e il <div id="app"> in cui Svelte monta l'interfaccia. Il manifest e il service worker (PWA) sono generati da vite.config.ts.
  Se aggiungi un nuovo servizio esterno, ricorda di autorizzarlo in connect-src/script-src della CSP.
-->
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' https://accounts.google.com/gsi/client; style-src 'self' 'unsafe-inline' https://accounts.google.com/gsi/style; img-src 'self' data:; frame-src https://accounts.google.com; connect-src 'self' ws://localhost:* https://www.googleapis.com https://accounts.google.com; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <meta name="referrer" content="no-referrer" />
    <meta name="theme-color" content="#3f0e40" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>toDo</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
